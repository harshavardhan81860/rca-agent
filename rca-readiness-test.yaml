apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-readiness-test
  namespace: rca-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rca-readiness-test
  template:
    metadata:
      labels:
        app: rca-readiness-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health-check
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
