apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-startup-test
  namespace: rca-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rca-startup-test
  template:
    metadata:
      labels:
        app: rca-startup-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /wrong-startup-check
              port: 80
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
