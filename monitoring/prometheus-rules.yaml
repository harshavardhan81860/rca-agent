apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rca-agent-alert-rules
  namespace: monitoring
  labels:
    release: kps
    app: rca-agent
spec:
  groups:
    - name: rca-agent.pod-alerts
      rules:
        - alert: PodCrashLooping
          expr: |
            kube_pod_container_status_waiting_reason{
              reason="CrashLoopBackOff"
            } == 1
          for: 2m
          labels:
            severity: critical
            category: application
          annotations:
            summary: "Container is in CrashLoopBackOff"
            description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping."

        - alert: PodRestartingFrequently
          expr: |
            increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 2m
          labels:
            severity: warning
            category: application
          annotations:
            summary: "Container restarting frequently"
            description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 15 minutes."

        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{condition="true"} == 0
            and on(namespace, pod)
            (kube_pod_status_phase{phase="Running"} == 1)
          for: 5m
          labels:
            severity: warning
            category: application
          annotations:
            summary: "Pod is not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been unready for 5 minutes."

    - name: rca-agent.node-alerts
      rules:
        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{
              condition="Ready",
              status="true"
            } == 0
          for: 2m
          labels:
            severity: critical
            category: infrastructure
          annotations:
            summary: "Kubernetes node is not ready"
            description: "Node {{ $labels.node }} is reporting NotReady."

    - name: rca-agent.deployment-alerts
      rules:
        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas
            !=
            kube_deployment_status_replicas_available
          for: 5m
          labels:
            severity: warning
            category: application
          annotations:
            summary: "Deployment replicas mismatch"
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} does not have the expected number of available replicas."
