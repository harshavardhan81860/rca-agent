apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-crash-test
  namespace: rca-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rca-crash-test
  template:
    metadata:
      labels:
        app: rca-crash-test
    spec:
      containers:
        - name: crash-container
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - "echo 'RCA test: application starting'; exit 1"
